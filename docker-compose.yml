services:
  db:
      image: postgres:18.3-trixie
      container_name: db
      ports:
          - "5433:5432"
      environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
      restart: unless-stopped
      volumes:
          - ./data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 30s
        timeout: 5s
        retries: 5

  user:
      image: user:latest
      container_name: user
      ports:
          - "8080:8080"
      environment:
          DATABASE_URL: postgres://postgres:1234@db:5432/user_db
      restart: unless-stopped
      depends_on:
          - db



volumes:
  db_data:
